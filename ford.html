<!-- New / Used radio buttons -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Calculator</title>
</head>

<body>
<div>
  <label>
    <input type="radio" name="condition" value="new" id="new" checked>
    New
  </label>
  <label>
    <input type="radio" name="condition" value="used" id="used">
    Used
  </label>
</div>

<!-- This div will only appear when "Used" is selected -->
<div id="used-options" style="display: none; margin-top: 15px;">
  <p><strong>Discount Options (for Used vehicles):</strong></p>
  
  <!-- Advertising Discount Toggle -->
  <label>
    <input type="checkbox" id="adv-discount">
    Apply Advertising Discount
  </label>
  
  <!-- Financing Discount Toggle -->
  <label style="margin-left: 20px;">
    <input type="checkbox" id="fin-discount">
    Apply Financing Discount
  </label>
</div>

<!-- This div will only appear when "new" is selected -->
<div id="new-options" style="display: block; margin-top: 15px;">
  <p><strong>Discount Options (for NEW vehicles):</strong></p>
  
  <!-- Advertising Discount Toggle -->
  <label>
    <input type="checkbox" id="new-adv-discount">
    New Car Add
  </label>
  
  <!-- Financing Discount Toggle -->
  <label style="margin-left: 20px;">
    <input type="checkbox" id="new-fin-discount">
    Apply Financing Discount
  </label>
</div>

<script src="ford.js"></script>
</body>
</html>
