<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Calculator</title>
</head>

<body>
    <h1>Englewood Ford Simple Payment ESTIMATOR</h1>
    <div class="container">
    <form>
        
        <div>
  <label>
    <input type="radio" name="condition" value="new" id="new" checked>
    New
  </label>
  <label>
    <input type="radio" name="condition" value="used" id="used">
    Used
  </label>
</div>

<!-- This div will only appear when "Used" is selected -->
<div id="used-options" style="display: none; margin-top: 15px;">
  <p><strong>Discount Options (for Used vehicles):</strong></p>
  
  <!-- Advertising Discount Toggle -->
  <label>
    <input type="checkbox" id="adv-discount">
    Remove Trade In Discount (Customer NOT Trading)
  </label>
  
  <!-- Financing Discount Toggle -->
  <label style="margin-left: 20px;">
    <input type="checkbox" id="fin-discount">
    Remove Financing Discount (Customer Paying Cash)
  </label>
</div>



  
        <br><label for="sellPrice">Selling Price</label>
        <input type="number" name="sellPrice" id="sellPrice" value="0"><br><br>

        <!-- This div will only appear when "new" is selected -->
<div id="new-options" style="display: block; margin-top: 15px;">
  <p><strong>Discount Options (for NEW vehicles):</strong></p>
  
  <!-- Advertising Discount Toggle -->
<br><label for="ProCare">Pro Care</label>
        <input type="number" name="ProCare" id="ProCare" value="1950"><br><br>
</div>

  <br>
        
        
        <label for="tradePrice">Trade Value</label>
        <input type="number" name="tradePrice" id="tradePrice" value="0"><br><br>

        <label for="tradePayoff">Trade Payoff</label>
        <input type="number" name="tradePayoff" id="tradePayoff" value="0"><br><br>

        <input type="radio" id="newPlates" name="plates" value="new" checked>
        <label for="new">New Plates</label>
        <input type="radio" id="usedPlates" name="plates" value="transfer" >
        <label for="used">Transfer Plates</label><br><br>
        
        
        <label for="cashDown">Cash Down</label>
        <input type="number" name="cashDown" id="cashDown" value="0"><br><br>

        <label for="months">Term</label>
        <input type="number" name="months" id="months" value="72"><br><br>

        <label for="rate">Rate</label>
        <input type="text" name="rate" id="rate" value="9.0" size="4">%<br><br>

        
        
        
        
        
        
        
        <button>Get Payment</button>
    </form>
</div>
    <div class="result">

    </div>
    
<script src="calc4.js"></script>
</body>
</html>
